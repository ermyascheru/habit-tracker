<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f172a;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    #ht {
      max-width: 620px;
      margin: 0 auto;
    }

    h1 {
      font-size: 22px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 1.5rem;
      color: #f1f5f9;
    }

    /* Add row */
    #add-row {
      display: flex;
      gap: 8px;
      margin-bottom: 1.5rem;
    }

    #add-row input,
    #add-row select {
      background: #1e293b;
      border: 0.5px solid #334155;
      border-radius: 8px;
      color: #f1f5f9;
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
      transition: border-color .15s;
    }

    #add-row input { flex: 1; }
    #add-row select { width: 130px; cursor: pointer; }

    #add-row input:focus,
    #add-row select:focus { border-color: #64748b; }

    #add-row button {
      background: #22c55e;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity .15s;
      white-space: nowrap;
    }
    #add-row button:hover { opacity: .85; }

    /* Stats */
    #stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 1.5rem;
    }

    .stat-card {
      background: #1e293b;
      border-radius: 8px;
      padding: .75rem 1rem;
    }
    .stat-card .label { font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
    .stat-card .value { font-size: 22px; font-weight: 500; color: #f1f5f9; }

    /* Filters */
    .filter-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .filter-btn {
      background: transparent;
      border: 0.5px solid #334155;
      color: #94a3b8;
      border-radius: 99px;
      padding: 4px 12px;
      font-size: 12px;
      cursor: pointer;
      transition: all .15s;
    }
    .filter-btn:hover { border-color: #64748b; color: #f1f5f9; }
    .filter-btn.active { background: #1e293b; border-color: #64748b; color: #f1f5f9; }

    /* Habit cards */
    #habit-list { display: flex; flex-direction: column; gap: 10px; }

    .hcard {
      background: #1e293b;
      border: 0.5px solid #334155;
      border-radius: 12px;
      padding: 1rem 1.25rem;
      transition: border-color .15s;
    }
    .hcard:hover { border-color: #475569; }

    .hcard-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .hcard-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .hcard-meta { flex: 1; min-width: 0; }

    .hcard-name {
      font-size: 15px;
      font-weight: 500;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hcard-sub {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 99px;
      font-weight: 500;
    }
    .badge-fire  { background: #3b1f04; color: #FAC775; }
    .badge-done  { background: #052e16; color: #4ade80; }
    .badge-mile  { background: #2e1065; color: #c4b5fd; }

    /* Progress bar */
    .prog-wrap { margin-bottom: 10px; }

    .prog-label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #64748b;
      margin-bottom: 4px;
    }

    .prog-track {
      height: 6px;
      background: #0f172a;
      border-radius: 99px;
      overflow: hidden;
    }

    .prog-fill {
      height: 100%;
      border-radius: 99px;
      transition: width .4s cubic-bezier(.4,0,.2,1);
    }

    /* Action buttons */
    .hcard-actions { display: flex; gap: 8px; }

    .hcard-actions button {
      flex: 1;
      padding: 7px 10px;
      font-size: 13px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all .15s;
    }

    .btn-done {
      background: transparent;
      border: 0.5px solid #166534;
      color: #4ade80;
    }
    .btn-done:hover { background: #052e16; }

    .btn-undo {
      background: transparent;
      border: 0.5px solid #334155;
      color: #94a3b8;
    }
    .btn-undo:hover { background: #0f172a; }

    .btn-del {
      background: transparent;
      border: 0.5px solid #7f1d1d;
      color: #f87171;
      padding: 7px 10px;
      flex: 0 0 auto;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .15s;
      font-size: 16px;
    }
    .btn-del:hover { background: #450a0a; }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 3rem 1rem;
      color: #64748b;
      font-size: 14px;
    }
    .empty i { font-size: 36px; display: block; margin-bottom: 8px; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      border: 0.5px solid #475569;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 13px;
      color: #f1f5f9;
      pointer-events: none;
      opacity: 0;
      transition: opacity .25s;
      z-index: 99;
      white-space: nowrap;
    }

    ::placeholder { color: #475569; }

    select option { background: #1e293b; color: #f1f5f9; }
  </style>
</head>
<body>
<div id="ht">
  <h1>
    <i class="ti ti-flame" style="font-size:24px;color:#EF9F27" aria-hidden="true"></i>
    Habit Tracker
  </h1>

  <div id="add-row">
    <input type="text" id="hInput" placeholder="New habit name…" />
    <select id="hCat">
      <option value="health">Health</option>
      <option value="mind">Mind</option>
      <option value="fitness">Fitness</option>
      <option value="social">Social</option>
      <option value="work">Work</option>
      <option value="other">Other</option>
    </select>
    <button onclick="addHabit()">
      <i class="ti ti-plus" aria-hidden="true"></i> Add
    </button>
  </div>

  <div id="stats-row">
    <div class="stat-card">
      <div class="label">Total habits</div>
      <div class="value" id="s-total">0</div>
    </div>
    <div class="stat-card">
      <div class="label">Best streak</div>
      <div class="value" id="s-best">0 days</div>
    </div>
    <div class="stat-card">
      <div class="label">Done today</div>
      <div class="value" id="s-today">0 / 0</div>
    </div>
  </div>

  <div class="filter-row" id="filterRow"></div>
  <div id="habit-list"></div>
</div>

<div class="toast" id="toast"></div>

<script>
  const CATS = {
    health:  { icon: 'ti-heart',      color: '#F09595', bg: '#3b0a0a', text: '#fca5a5' },
    mind:    { icon: 'ti-brain',      color: '#AFA9EC', bg: '#1e1b4b', text: '#c4b5fd' },
    fitness: { icon: 'ti-run',        color: '#5DCAA5', bg: '#022c22', text: '#6ee7b7' },
    social:  { icon: 'ti-users',      color: '#85B7EB', bg: '#0c1a2e', text: '#93c5fd' },
    work:    { icon: 'ti-briefcase',  color: '#FAC775', bg: '#3b1f04', text: '#fcd34d' },
    other:   { icon: 'ti-star',       color: '#B4B2A9', bg: '#1e293b', text: '#94a3b8' },
  };

  const MILESTONES = [3, 7, 14, 21, 30, 60, 100];
  const today = new Date().toISOString().slice(0, 10);

  let habits = [];
  try { habits = JSON.parse(localStorage.getItem('ht2_habits')) || []; } catch(e) {}
  let filter = 'all';

  function save() {
    try { localStorage.setItem('ht2_habits', JSON.stringify(habits)); } catch(e) {}
  }

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.style.opacity = '0', 2200);
  }

  function nextMilestone(s) {
    return MILESTONES.find(m => m > s) || null;
  }

  function render() {
    const list = document.getElementById('habit-list');
    const filtered = filter === 'all'
      ? habits
      : filter === 'pending'
      ? habits.filter(h => h.lastDone !== today)
      : habits.filter(h => h.cat === filter);

    if (!filtered.length) {
      list.innerHTML = `<div class="empty">
        <i class="ti ti-clipboard-list" aria-hidden="true"></i>
        ${habits.length ? 'No habits match this filter.' : 'No habits yet — add one above!'}
      </div>`;
    } else {
      list.innerHTML = filtered.map(h => {
        const idx = habits.indexOf(h);
        const c = CATS[h.cat] || CATS.other;
        const done = h.lastDone === today;
        const pct = Math.min(Math.round((h.streak / 30) * 100), 100);
        const nm = nextMilestone(h.streak);
        const barColor = done ? '#22c55e' : c.color;
        const isMilestone = MILESTONES.includes(h.streak) && done;

        return `<div class="hcard">
          <div class="hcard-top">
            <div class="hcard-icon" style="background:${c.bg}">
              <i class="ti ${c.icon}" style="color:${c.text}" aria-hidden="true"></i>
            </div>
            <div class="hcard-meta">
              <div class="hcard-name">${h.name}</div>
              <div class="hcard-sub">
                <span class="badge badge-fire">
                  <i class="ti ti-flame" style="font-size:11px" aria-hidden="true"></i>
                  ${h.streak} day streak
                </span>
                ${done ? `<span class="badge badge-done">
                  <i class="ti ti-check" style="font-size:11px" aria-hidden="true"></i>
                  done today
                </span>` : ''}
                ${isMilestone ? `<span class="badge badge-mile">milestone!</span>` : ''}
              </div>
            </div>
            <button class="btn-del" onclick="deleteHabit(${idx})" aria-label="Delete habit">
              <i class="ti ti-trash" aria-hidden="true"></i>
            </button>
          </div>
          <div class="prog-wrap">
            <div class="prog-label">
              <span>30-day goal</span>
              <span>${pct}%${nm ? ` · next: ${nm} days` : ' · goal reached!'}</span>
            </div>
            <div class="prog-track">
              <div class="prog-fill" style="width:${pct}%;background:${barColor}"></div>
            </div>
          </div>
          <div class="hcard-actions">
            ${done
              ? `<button class="btn-undo" onclick="undoToday(${idx})">
                  <i class="ti ti-arrow-back-up" aria-hidden="true"></i> Undo
                </button>`
              : `<button class="btn-done" onclick="markDone(${idx})">
                  <i class="ti ti-check" aria-hidden="true"></i> Mark done today
                </button>`}
          </div>
        </div>`;
      }).join('');
    }

    document.getElementById('s-total').textContent = habits.length;
    document.getElementById('s-best').textContent = habits.reduce((b, h) => Math.max(b, h.streak), 0) + ' days';
    const doneToday = habits.filter(h => h.lastDone === today).length;
    document.getElementById('s-today').textContent = `${doneToday} / ${habits.length}`;
    renderFilters();
  }

  function renderFilters() {
    const used = ['all', 'pending', ...new Set(habits.map(h => h.cat))];
    const labels = { all:'All', pending:'Pending', health:'Health', mind:'Mind', fitness:'Fitness', social:'Social', work:'Work', other:'Other' };
    document.getElementById('filterRow').innerHTML = used.map(f =>
      `<button class="filter-btn${filter === f ? ' active' : ''}" onclick="setFilter('${f}')">${labels[f] || f}</button>`
    ).join('');
  }

  function setFilter(f) { filter = f; render(); }

  function addHabit() {
    const inp = document.getElementById('hInput');
    const cat = document.getElementById('hCat').value;
    const name = inp.value.trim();
    if (!name) return;
    habits.push({ name, cat, streak: 0, lastDone: null, created: today });
    inp.value = '';
    save();
    render();
    toast('Habit added!');
  }

  function markDone(i) {
    habits[i].lastDone = today;
    habits[i].streak++;
    save();
    render();
    if (MILESTONES.includes(habits[i].streak)) {
      toast(`${habits[i].streak}-day milestone! Keep going!`);
    } else {
      toast('Nice work! Streak updated.');
    }
  }

  function undoToday(i) {
    habits[i].lastDone = null;
    habits[i].streak = Math.max(0, habits[i].streak - 1);
    save();
    render();
    toast('Undone.');
  }

  function deleteHabit(i) {
    const name = habits[i].name;
    habits.splice(i, 1);
    save();
    render();
    toast(`"${name}" removed.`);
  }

  document.getElementById('hInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') addHabit();
  });

  render();
</script>
</body>
</html>
