<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Momentum - Habit Tracker</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    min-height:100vh;
    background:
    linear-gradient(135deg,#0f172a,#111827,#1e1b4b);
    color:white;
    padding:40px 20px;
}

.container{
    max-width:900px;
    margin:auto;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.logo{
    font-size:32px;
    font-weight:700;
}

.logo span{
    color:#22c55e;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.stat-card{
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    backdrop-filter:blur(12px);
    border-radius:24px;
    padding:25px;
    box-shadow:0 10px 30px rgba(0,0,0,0.25);
}

.stat-card h2{
    font-size:34px;
    margin-top:10px;
}

.input-card{
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    backdrop-filter:blur(12px);
    border-radius:24px;
    padding:25px;
    margin-bottom:30px;
}

.input-group{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

input,select{
    flex:1;
    min-width:200px;
    padding:14px;
    border:none;
    border-radius:14px;
    background:rgba(255,255,255,0.08);
    color:white;
    outline:none;
    font-size:15px;
}

input::placeholder{
    color:#cbd5e1;
}

button{
    border:none;
    border-radius:14px;
    padding:14px 18px;
    cursor:pointer;
    font-weight:600;
    transition:0.25s;
}

.add-btn{
    background:#22c55e;
    color:white;
}

.add-btn:hover{
    transform:translateY(-2px);
    opacity:0.9;
}

.search{
    width:100%;
    margin-top:20px;
}

.habits{
    display:grid;
    gap:20px;
}

.habit{
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    backdrop-filter:blur(12px);
    border-radius:24px;
    padding:25px;
    animation:fadeIn 0.4s ease;
    transition:0.3s;
}

.habit:hover{
    transform:translateY(-4px);
}

.habit-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    gap:15px;
}

.habit-name{
    font-size:22px;
    font-weight:600;
}

.badge{
    padding:8px 12px;
    border-radius:999px;
    font-size:13px;
    font-weight:600;
}

.study{
    background:#2563eb;
}

.health{
    background:#dc2626;
}

.coding{
    background:#9333ea;
}

.fitness{
    background:#16a34a;
}

.progress-container{
    margin-top:15px;
}

.progress-label{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
    color:#cbd5e1;
}

.progress{
    height:12px;
    background:#1e293b;
    border-radius:999px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    background:linear-gradient(90deg,#22c55e,#4ade80);
    border-radius:999px;
    transition:1s;
}

.heatmap{
    display:flex;
    gap:8px;
    margin-top:20px;
    flex-wrap:wrap;
}

.day{
    width:22px;
    height:22px;
    border-radius:6px;
    background:#334155;
}

.done{
    background:#22c55e;
}

.actions{
    display:flex;
    gap:12px;
    margin-top:25px;
    flex-wrap:wrap;
}

.complete-btn{
    background:#22c55e;
    color:white;
}

.delete-btn{
    background:#ef4444;
    color:white;
}

.empty{
    text-align:center;
    padding:60px 20px;
    color:#cbd5e1;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@media(max-width:700px){

    .topbar{
        flex-direction:column;
        gap:15px;
        align-items:flex-start;
    }

    .habit-top{
        flex-direction:column;
        align-items:flex-start;
    }

}

</style>
</head>
<body>

<div class="container">

    <div class="topbar">
        <div>
            <div class="logo">Momentum<span>.</span></div>
            <p>Build consistency. One day at a time.</p>
        </div>
    </div>

    <div class="stats">

        <div class="stat-card">
            <p>Total Habits</p>
            <h2 id="totalHabits">0</h2>
        </div>

        <div class="stat-card">
            <p>Best Streak</p>
            <h2 id="bestStreak">0🔥</h2>
        </div>

        <div class="stat-card">
            <p>Completed Today</p>
            <h2 id="completedToday">0</h2>
        </div>

    </div>

    <div class="input-card">

        <div class="input-group">

            <input type="text" id="habitInput" placeholder="Enter a habit...">

            <select id="category">
                <option value="study">Study</option>
                <option value="coding">Coding</option>
                <option value="fitness">Fitness</option>
                <option value="health">Health</option>
            </select>

            <button class="add-btn" onclick="addHabit()">
                Add Habit
            </button>

        </div>

        <input
            class="search"
            type="text"
            id="search"
            placeholder="Search habits..."
            oninput="renderHabits()"
        >

    </div>

    <div class="habits" id="habitList"></div>

</div>

<script>

let habits = JSON.parse(localStorage.getItem('modernHabits')) || [];

function saveHabits(){
    localStorage.setItem('modernHabits', JSON.stringify(habits));
}

function updateStats(){

    document.getElementById('totalHabits').innerText = habits.length;

    let best = 0;
    let completed = 0;

    habits.forEach(habit => {

        if(habit.streak > best){
            best = habit.streak;
        }

        if(habit.completedToday){
            completed++;
        }

    });

    document.getElementById('bestStreak').innerText = best + '🔥';

    document.getElementById('completedToday').innerText = completed;
}

function addHabit(){

    const input = document.getElementById('habitInput');
    const category = document.getElementById('category').value;

    if(input.value.trim() === '') return;

    habits.push({
        name:input.value,
        category:category,
        streak:0,
        completedToday:false,
        heatmap:Array(14).fill(false)
    });

    input.value = '';

    saveHabits();

    renderHabits();
}

function completeHabit(index){

    const habit = habits[index];

    if(habit.completedToday) return;

    habit.streak++;

    habit.completedToday = true;

    habit.heatmap.shift();
    habit.heatmap.push(true);

    if(habit.streak === 7 ||
       habit.streak === 30 ||
       habit.streak === 100){

        alert('🔥 Milestone reached: ' + habit.streak + ' day streak!');
    }

    saveHabits();

    renderHabits();
}

function resetDay(){

    habits.forEach(habit => {
        habit.completedToday = false;
    });

    saveHabits();

    renderHabits();
}

function deleteHabit(index){

    habits.splice(index,1);

    saveHabits();

    renderHabits();
}

function renderHabits(){

    const habitList = document.getElementById('habitList');

    const search = document.getElementById('search').value.toLowerCase();

    habitList.innerHTML = '';

    const filtered = habits.filter(habit =>
        habit.name.toLowerCase().includes(search)
    );

    if(filtered.length === 0){

        habitList.innerHTML = `
            <div class="empty">
                <h2>No habits found 🚀</h2>
                <p>Start building your future today.</p>
            </div>
        `;

        updateStats();

        return;
    }

    filtered.forEach((habit,index) => {

        let percent = Math.min((habit.streak / 30) * 100,100);

        let heatmapHTML = '';

        habit.heatmap.forEach(day => {
            heatmapHTML += `
                <div class="day ${day ? 'done' : ''}"></div>
            `;
        });

        habitList.innerHTML += `

            <div class="habit">

                <div class="habit-top">

                    <div>
                        <div class="habit-name">${habit.name}</div>
                        <p>🔥 ${habit.streak} Day Streak</p>
                    </div>

                    <div class="badge ${habit.category}">
                        ${habit.category}
                    </div>

                </div>

                <div class="progress-container">

                    <div class="progress-label">
                        <span>Progress to 30 Days</span>
                        <span>${percent.toFixed(0)}%</span>
                    </div>

                    <div class="progress">
                        <div class="progress-bar" style="width:${percent}%"></div>
                    </div>

                </div>

                <div class="heatmap">
                    ${heatmapHTML}
                </div>

                <div class="actions">

                    <button
                        class="complete-btn"
                        onclick="completeHabit(${index})"
                    >
                        ${habit.completedToday ? 'Completed ✅' : 'Done Today'}
                    </button>

                    <button
                        class="delete-btn"
                        onclick="deleteHabit(${index})"
                    >
                        Delete
                    </button>

                </div>

            </div>

        `;
    });

    updateStats();
}

renderHabits();

</script>

</body>
</html>
